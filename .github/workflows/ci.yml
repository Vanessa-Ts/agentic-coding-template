name: CI


on:
  push:
    branches:
      - "**"


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Build production image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Build test image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          target: test
          load: true
          tags: agentic-coding-template:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests
        run: |
          docker run --name test_container agentic-coding-template:latest
          
      - name: Extract reports
        if: always()
        run: |
          mkdir -p reports
          docker cp test_container:/app/coverage.xml reports/coverage.xml
          docker cp test_container:/app/report.xml reports/report.xml

      - name: Cleanup container
        if: always()
        run: docker rm test_container

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-report
          path: reports/coverage.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-report
          path: reports/report.xml

  evals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Phase 1 — agent/skill/command structural lint
        run: pytest evals/test_structural.py -v --tb=short --no-cov

      - name: Phase 3 — skill activation matrix
        run: pytest evals/test_skill_matrix.py -v --tb=short --no-cov

      # Phase 2 behavioral tests are LOCAL-ONLY — not in CI.
      # Run manually: pytest evals/test_behavioral.py -v -m behavioral
