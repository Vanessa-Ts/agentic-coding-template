[project]
name = "docker-dev-template"
version = "0.2.1"
requires-python = ">=3.11,<3.14"
authors = [{name = "VanessaTs"}]
dependencies = [
    "fastapi~=0.136.0",
    "openai~=2.38.0",
    "uvicorn[standard]~=0.48.0",
    "pydantic~=2.13.0",
    "pydantic-settings~=2.14.0",
    "jinja2~=3.1.0",
    "python-dotenv~=1.2.0",
]

[dependency-groups]
dev = [
    { include-group = "test" },
    "black~=26.5.0",
    "isort~=8.0.0",
    "ruff~=0.15.0",
    "mypy~=2.1.0",
]
test = [
    "pytest~=8.3.0",
    "pytest-asyncio~=1.2.0",
    "pytest-cov~=7.1.0",
    "httpx~=0.28.0",
    "httpx2>=2.2.0",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--junitxml=report.xml"
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "S"]
ignore = ["E402"]


[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_no_return = true
ignore_missing_imports = false
pretty = true

