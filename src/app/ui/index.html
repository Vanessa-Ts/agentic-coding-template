<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ app_name }}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <h1>{{ app_name }}</h1>
      <p class="hero-desc">A collection of specialised agents and auto-loading skills that
        bring Claude Code patterns to every layer of your FastAPI service — from planning
        and implementation to review, testing, and deployment.</p>
    </div>
  </header>
  <main class="catalogue">
    <section class="cat-section" id="agents-section">
      <h2>Agents</h2>
      <div class="card-grid" id="agents-grid"></div>
    </section>
    <section class="cat-section" id="skills-section">
      <h2>Skills</h2>
      <div class="card-grid" id="skills-grid"></div>
    </section>
  </main>
  <script src="https://unpkg.com/lucide@0.525.0/dist/umd/lucide.min.js"></script>
  <script>
    (function () {
      function renderChips(connects_to, container) {
        if (!connects_to || connects_to.length === 0) {
          var dash = document.createElement('span');
          dash.className = 'chip';
          dash.textContent = '—';
          container.appendChild(dash);
          return;
        }
        connects_to.forEach(function (c) {
          var chip = document.createElement('span');
          chip.className = 'chip';
          chip.textContent = c;
          container.appendChild(chip);
        });
      }

      function renderCard(item) {
        var article = document.createElement('article');
        article.className = 'agent-card';
        article.setAttribute('data-expanded', 'false');
        article.setAttribute('role', 'button');
        article.setAttribute('aria-expanded', 'false');

        var header = document.createElement('div');
        header.className = 'card-header';

        var iconEl = document.createElement('i');
        iconEl.setAttribute('data-lucide', item.icon);
        iconEl.className = 'card-icon';
        header.appendChild(iconEl);

        var nameSpan = document.createElement('span');
        nameSpan.className = 'card-name';
        nameSpan.textContent = item.name;
        header.appendChild(nameSpan);

        var badge = document.createElement('span');
        badge.classList.add('badge', 'type-' + item.type);
        badge.textContent = item.type;
        header.appendChild(badge);

        article.appendChild(header);

        var roleP = document.createElement('p');
        roleP.className = 'card-role';
        roleP.textContent = item.role;
        article.appendChild(roleP);

        var detail = document.createElement('div');
        detail.className = 'card-detail';
        detail.hidden = true;

        var chipsDiv = document.createElement('div');
        chipsDiv.className = 'connects-chips';
        renderChips(item.connects_to, chipsDiv);
        detail.appendChild(chipsDiv);

        article.appendChild(detail);

        article.addEventListener('click', function () {
          var expanded = article.getAttribute('data-expanded') === 'true';
          if (expanded) {
            detail.hidden = true;
            article.setAttribute('data-expanded', 'false');
            article.setAttribute('aria-expanded', 'false');
          } else {
            document.querySelectorAll('.agent-card[data-expanded="true"]').forEach(function (open) {
              open.querySelector('.card-detail').hidden = true;
              open.setAttribute('data-expanded', 'false');
              open.setAttribute('aria-expanded', 'false');
            });
            detail.hidden = false;
            article.setAttribute('data-expanded', 'true');
            article.setAttribute('aria-expanded', 'true');
          }
        });

        return article;
      }

      document.addEventListener('DOMContentLoaded', function () {
        fetch('/api/agents')
          .then(function (res) { return res.json(); })
          .then(function (data) {
            var agentsGrid = document.getElementById('agents-grid');
            var skillsGrid = document.getElementById('skills-grid');

            (data.agents || []).forEach(function (item) {
              agentsGrid.appendChild(renderCard(item));
            });

            (data.skills || []).forEach(function (item) {
              skillsGrid.appendChild(renderCard(item));
            });

            lucide.createIcons();
          })
          .catch(function (err) {
            console.error('Failed to load agent catalogue:', err);
          });
      });
    }());
  </script>
</body>
</html>
