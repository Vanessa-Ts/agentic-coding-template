<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ app_name }}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <h1>{{ app_name }}</h1>
      <p class="hero-desc">A collection of specialised agents and auto-loading skills that
        bring Claude Code patterns to every layer of your FastAPI service — from planning
        and implementation to review, testing, and deployment.</p>
    </div>
  </header>
  <main class="catalogue">
    <section class="cat-section" id="agents-section">
      <h2>Agents</h2>
      <div class="card-grid" id="agents-grid"></div>
    </section>
    <section class="cat-section" id="skills-section">
      <h2>Skills</h2>
      <div class="card-grid" id="skills-grid"></div>
    </section>
  </main>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    (function () {
      function renderChips(connects_to) {
        if (!connects_to || connects_to.length === 0) {
          return '<span class="chip">—</span>';
        }
        return connects_to.map(function (c) {
          return '<span class="chip">' + c + '</span>';
        }).join('');
      }

      function renderCard(item) {
        var article = document.createElement('article');
        article.className = 'agent-card';
        article.setAttribute('data-expanded', 'false');
        article.setAttribute('role', 'button');
        article.setAttribute('aria-expanded', 'false');
        article.innerHTML =
          '<div class="card-header">' +
            '<i data-lucide="' + item.icon + '" class="card-icon"></i>' +
            '<span class="card-name">' + item.name + '</span>' +
            '<span class="badge type-' + item.type + '">' + item.type + '</span>' +
          '</div>' +
          '<p class="card-role">' + item.role + '</p>' +
          '<div class="card-detail" hidden>' +
            '<div class="connects-chips">' +
              renderChips(item.connects_to) +
            '</div>' +
          '</div>';

        article.addEventListener('click', function () {
          var expanded = article.getAttribute('data-expanded') === 'true';
          var detail = article.querySelector('.card-detail');
          if (expanded) {
            detail.hidden = true;
            article.setAttribute('data-expanded', 'false');
            article.setAttribute('aria-expanded', 'false');
          } else {
            // Collapse any currently open card
            document.querySelectorAll('.agent-card[data-expanded="true"]').forEach(function (open) {
              open.querySelector('.card-detail').hidden = true;
              open.setAttribute('data-expanded', 'false');
              open.setAttribute('aria-expanded', 'false');
            });
            detail.hidden = false;
            article.setAttribute('data-expanded', 'true');
            article.setAttribute('aria-expanded', 'true');
          }
        });

        return article;
      }

      document.addEventListener('DOMContentLoaded', function () {
        fetch('/api/agents')
          .then(function (res) { return res.json(); })
          .then(function (data) {
            var agentsGrid = document.getElementById('agents-grid');
            var skillsGrid = document.getElementById('skills-grid');

            (data.agents || []).forEach(function (item) {
              agentsGrid.appendChild(renderCard(item));
            });

            (data.skills || []).forEach(function (item) {
              skillsGrid.appendChild(renderCard(item));
            });

            lucide.createIcons();
          })
          .catch(function (err) {
            console.error('Failed to load agent catalogue:', err);
          });
      });
    }());
  </script>
</body>
</html>
